name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: |
            RC_Agent/mcp-server/package-lock.json
            RC_Agent/vscode-extension/package-lock.json

      - name: Install mcp-server dependencies
        run: npm --prefix RC_Agent/mcp-server ci

      - name: Run mcp-server tests
        run: npm --prefix RC_Agent/mcp-server test

      - name: Install vscode-extension dependencies
        run: npm --prefix RC_Agent/vscode-extension ci

      - name: Compile vscode-extension
        run: npm --prefix RC_Agent/vscode-extension run compile

      - name: Run vscode-extension tests
        run: |
          # Use xvfb to run VS Code tests on a headless Linux server
          /usr/bin/xvfb-run --auto-servernum npm --prefix RC_Agent/vscode-extension test
