    GeneralError:
      description: An error occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/failure'
    "201Created":
      description: Created
      content: {}
    "202Accepted":
      description: Created
      content: {}
    "204OperationPerformed":
      description: Operation performed successfully. There is no data to be returned
      content: {}
    "400BadRequest":
      description: Bad input parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/failure'
    "401NotAuthorized":
      description: Authorization information is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/failure'
          example:
            errors:
            - id: string
              status: string
              code: 401
              title: string
              detail: string
              pointer: string
              parameter: string
    "403Forbidden":
      description: Access Denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/failure'
          example:
            errors:
            - id: string
              status: string
              code: 403
              title: string
              detail: string
              pointer: string
              parameter: string
    "404NotFound":
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/failure'
    "405NotFound":
      description: The resource doesn't support the specified HTTP verb
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/failure'
    "500InternalServerError":
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/failure'
          example:
            errors:
            - id: string
              status: string
              code: 500
              title: string
              detail: string
              pointer: string
              parameter: string
              meta: {}
            meta: {}
            jsonapi:
              version: string
              meta: {}
