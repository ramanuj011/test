  /domains/{synId}/profile:
    get:
      tags:
      - Domains
      summary: Returns values for all supported statistical features for all columns.
      parameters:
      - name: synId
        in: path
        description: |
          Unique ID of the artifact.
          The ID may alternatively be a base64 encoded path of the artifact being requested.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          ibisamp/car:
            summary: ibisamp/car
            value: aWJpc2FtcC9jYXI
      responses:
        "200":
          description: The values for all supported statistical features for all columns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domainSynProfileSuccess'
              examples:
                ibisamp/car:
                  $ref: '#/components/examples/domainSynProfileGetSuccess_ibisamp_car'
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        error:
                          type: string
                        ref:
                          type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        error:
                          type: string
                        ref:
                          type: string
                example: |
                  {
                    "errors": [
                      {
                        "error": "Metadata parser error",
                        "ref": "ibisamp/car_err"
                      }
                    ]
                  }
    post:
      tags:
      - Domains
      summary: Returns values for requested by user statistical features and columns.
      parameters:
      - name: synId
        in: path
        description: |
          Unique ID of the artifact.
          The ID may alternatively be a base64 encoded path of the artifact being requested.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          ibisamp/car:
            summary: ibisamp/car
            value: aWJpc2FtcC9jYXI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/domainSynProfileBody'
            examples:
              ibisamp/car:
                $ref: '#/components/examples/domainSynProfileBody_ibisamp_car'
      responses:
        "200":
