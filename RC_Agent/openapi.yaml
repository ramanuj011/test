      tags:
      - Core
      summary: Validates an expression associated with Data Definition.
      description: |
        Validates an expression associated with Data Definition.
      parameters:
      - name: synId
        in: path
        description: |
          Unique ID of the artifact.
          The ID may alternatively be a base64 encoded path of the artifact being requested.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          ibisamp/car:
            value: aWJpc2FtcC9jYXI
          ibisamp/employee:
            value: aWJpc2FtcC9lbXBsb3llZQ
          retail_samples/wf_retail_lite:
            value: cmV0YWlsX3NhbXBsZXMvd2ZfcmV0YWlsX2xpdGU
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bodyExpressionValidate'
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expressionValidatePostSuccess'
        400:
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
  /core/engine/expression/{synId}/content:
    post:
      tags:
      - Core
      summary: Get content of an expression associated with Data Definition.
      description: Get content of an expression associated with Data Definition.
      parameters:
      - name: synId
        in: path
        description: |
          Unique ID of the artifact.
          The ID may alternatively be a base64 encoded path of the artifact being requested.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          ibisamp/empdata:
            value: aWJpc2FtcC9lbXBkYXRh
          ibisamp/joblist:
            value: aWJpc2FtcC9qb2JsaXN0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bodyExpressionContent'
            examples:
              ibisamp/empdata:
                value: |
                  {
                    "action": "get content",
                    "field":"EMPDATA.AREA"
                  }
              ibisamp/joblist:
                value: |
                  {
                    "action": "get content",
                    "field":"JOBLIST.JOBSEG.GRADE"
                  }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/expressionContentPostSuccess'
              examples:
                ibisamp/joblist.mas:
                  value: |
                    {
                      "result": "true",
                      "aggregation": "false",
                      "expression type": "define",
                      "expression name": "GRADE",
                      "expression title": "",
                      "expression usage": "A2",
                      "expression": "EDIT( JCLASS, '$$$99' )",
                      "function-based": "true",
                      "funinfo name": "EDIT",
                      "funinfo category": "Character",
                      "funinfo na": "2",
                      "argument number": "2",
                      "argument list": [
                        "JCLASS",
                        "'$$$99'"
                      ]
                    }
                ibisamp/empdata.mas:
                  value:
                    {
                      "result": "true",
                      "aggregation": "false",
                      "expression type": "define",
                      "expression name": "AREA",
                      "expression title": "",
                      "expression usage": "A13",
                      "expression": "DECODE DIV ( 'NE', 'NORTH EASTERN', 'SE', 'SOUTH EASTERN', 'CE', 'CENTRAL', 'WE', 'WESTERN', 'CORP', 'CORPORATE', ELSE 'INVALID AREA' )",
                      "function-based": "true",
                      "funinfo name": "DECODE",
                      "funinfo category": "Data Source and Decoding - Legacy",
                      "funinfo na": "4",
                      "argument number": "2",
                      "argument list": [
                        "DIV",
                        "'NE', 'NORTH EASTERN', 'SE', 'SOUTH EASTERN', 'CE', 'CENTRAL', 'WE', 'WESTERN', 'CORP', 'CORPORATE', ELSE 'INVALID AREA'"
                      ]
                    }
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
