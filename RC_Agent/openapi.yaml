components:
  schemas:
    domainSuccessJS:
      required:
      - data
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/meta'
        data:
          $ref: '#/components/schemas/resources'
        links:
          $ref: '#/components/schemas/pagination'
      description: The JSON envelop of the Domain resource item.
    domainsPostBody:
      required:
        - apppath_override
      type: object
      properties:
        apppath_override:
          type: array
          items:
            type: string
    resources:
      type: array
      items:
        $ref: '#/components/schemas/resource'
    resource:
      required:
      - attributes
      - id
      - type
      type: object
      properties:
        id:
          type: string
          description: Unique ID.
          format: uuid
          readOnly: true
        type:
          type: string
          description: |
            Object Types.
          example: FexFile
          enum:
          - unknownType
          - ApplicationFolder
          - SynonymFile
          - UserFile
          - FexFile
          - IBFSFolder
          - WebFOCUSComponent
          - IBFSFile
          - ReposStructure
          - MRUserRelated
          - MRRepository
          - MRFolder
          - ROFexFile
          - StyFile
          - UserProfile
          - ProfileFile
          - HelpFile
          - CssFile
          - TempFile
          - HtmlFile
          - DeferredTicket
          - DeferredOutput
          - CasterSchedule
          - CasterAccessList
          - CasterDistributionList
          - BroadcastFile
          - URLFile
          - CasterLibrary
          - MyReportFolder
          - VisualDiscoveryFile
          - LinkItem
          - MRFavoritesFolder
          - CasterLibraryX
          - SessionTempFolder
          - UserTempFolder
          - MRPortalFolder
          - WhatIfFile
          - Property
          - PGXBundle
          - Manifest
          - PRTLXBundle
          - Parameter
          - RecycleBin
          - RecycleBag
          - cfgFolder
          - cfgFile
          - cfgVariable
          - SecurityProvider
          - Session
          - UserFile
          - User
          - Group
          - Role
          - PermissionSet
          - Rule
          - Operations
          - RuleSet
          - Privilege
          - ExternalGroup
          - ExternalUser
          - EDANode
          - WEBFile
          - WEBFolder
          - MemoryVirtualFolder
          - PersistentVirtualFolder
          - Template
          - AnnotationContainer
          - AnnotationEntry
          - BipPortalsObject
          - BipPortalsSubArea
          - BipPortalsPortal
          - BipPortalsPage
          - BipPortalsFolder
          - BipPortalsOther
        attributes:
          $ref: '#/components/schemas/domainItem'
      description: Domain resource item.
    domainItem:
      description: domain item object
      allOf:
      - required:
        - container
        - createdOn
        - description
        - lastModified
        - name
        - parentID
        - policy
        - size
        type: object
        properties:
          parentID:
            type: string
            description: Parent ID.
            format: uuid
          container:
            type: boolean
            default: false
          path:
            type: string
            description: Full file name (root/folder/objectName.ext)
            example: IBFS:/WFC/Repository/Retail_Samples/Charts/Bar_Chart_Highest_Margin_Products.fex
          name:
            type: string
            description: File Name
            example: Bar_Chart_Highest_Margin_Products.fex
          description:
            type: string
            description: Detailed description (title) of object.
            example: Bar - Highest Margin Products
          createdOn:
            type: string
            description: |
              Created On date.
              The date-time notation as defined by RFC 3339
              https://tools.ietf.org/html/rfc3339
            format: date-time
            readOnly: true
            example: 2018-08-27T15:41:15.554Z
          lastModified:
            type: string
            description: Last modified date
            format: date-time
            readOnly: true
            example: 2019-05-30T16:52:44.591Z
          size:
            minimum: 0
            type: integer
            description: size of object
            format: int32
            readOnly: true
            example: 1702
          sortOrder:
            type: integer
            description: |
              Custom sort order, used to override default sort order.
            format: int32
            example: -1
            default: 0
          thumbPath:
            type: string
            description: |
              Thumbnail for object.
              May be blank or null, when null or blank use glyphClass.
              Oherwie will either be a href or an ID, which will be used in the getResourceAssocImageById to retrieve image.
            example: /ibi_html/ibi_images/chart_type/bar.svg
          glyphClass:
            type: string
            description: |
              Alternate to Thumbnail.
              May be null or blank.
            example: ibx-label-glyph ibx-label-icon ibi-icons
          policy:
            type: string
            description: |
              Base64 encoded policy, used for determining authoriztion and operation options.
            example: /7P/fv8ON+zggAAAAAAAAAAAAAAAAAB4AAAA
          ownerName:
            type: string
            description: |
              Owner name, used to determine access priveleges, private or published(security rules applied).
            example: admin
          sharedToOthers:
            type: boolean
            description: |
              The object is shared to others, the owner shared it.
              (private objects only in my content)
            example: false
            default: false
