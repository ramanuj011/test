version: '3.8'

services:
  # Temporary mock schedule service for local testing (no Maven required)
  schedule-service-mock:
    build: ./schedule-service-mock
    container_name: schedule-service-mock
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-server:
    build: ./mcp-server
    container_name: mcp-server
    ports:
      - "8080:3000"
    environment:
      - SCHEDULE_URL=http://schedule-service-mock:8081/api/schedules
      - MCP_EXTERNAL_URL=http://mcp-server:3000/mcp
      - OSLO_BASE_URL=http://10.10.100.81:31090/webfocus
    depends_on:
      - schedule-service-mock

  agent:
    build: ./agent
    container_name: agent
    environment:
      - MCP_SERVER_URL=http://mcp-server:3000/mcp
      - PORT=5000
      - OPENAI_API_KEY=
      - LLM_PROVIDER=openai
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - OLLAMA_MODEL=llama3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:5000"
    command: server
    depends_on:
      - mcp-server
    # To run the CLI directly: `docker compose run --rm agent list-schedules`
