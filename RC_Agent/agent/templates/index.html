<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Chat Agent</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="chat-container">
        <header>
            <h1>MCP Agent</h1>
            <div class="status-indicator">
                <span class="dot"></span> Online
            </div>
        </header>

        <div class="messages" id="messages">
            <div class="message ai">
                <div class="avatar">AI</div>
                <div class="content">Hello! I can help you with Oslo API tools and calculations.</div>
            </div>
        </div>

        <div class="suggestions" id="suggestions">
            {% for suggestion in suggestions %}
            <div class="suggestion-tag" onclick="useSuggestion('{{ suggestion }}')">{{ suggestion }}</div>
            {% endfor %}
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
            <button id="sendBtn">
                <svg class="send-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
                <svg class="stop-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" style="display: none;">
                    <rect x="6" y="6" width="12" height="12"></rect>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const sendIcon = sendBtn.querySelector('.send-icon');
        const stopIcon = sendBtn.querySelector('.stop-icon');

        let currentAbortController = null;
        let isProcessing = false;

        function setProcessingState(processing) {
            isProcessing = processing;
            if (processing) {
                sendBtn.classList.add('stop-mode');
                sendIcon.style.display = 'none';
                stopIcon.style.display = 'block';
            } else {
                sendBtn.classList.remove('stop-mode');
                sendIcon.style.display = 'block';
                stopIcon.style.display = 'none';
            }
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = sender === 'user' ? 'U' : 'AI';

            const content = document.createElement('div');
            content.className = 'content';
            if (sender === 'user') {
                content.textContent = text;
            } else {
                content.innerHTML = marked.parse(text);
            }

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(content);
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return content;
        }

        async function sendMessage() {
            if (isProcessing) {
                if (currentAbortController) {
                    currentAbortController.abort();
                    currentAbortController = null;
                }
                return;
            }

            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';

            const aiContent = addMessage('', 'ai');
            setProcessingState(true);

            currentAbortController = new AbortController();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                    signal: currentAbortController.signal
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let done = false;
                let fullResponse = "";
                while (!done) {
                    const { value, done: readerDone } = await reader.read();
                    done = readerDone;
                    const chunk = decoder.decode(value, { stream: true });
                    fullResponse += chunk;
                    aiContent.innerHTML = marked.parse(fullResponse);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    aiContent.innerHTML += "<br><em>[Request stopped by user]</em>";
                } else {
                    aiContent.textContent = "Error communicating with server.";
                }
                console.error(err);
            } finally {
                setProcessingState(false);
                currentAbortController = null;
            }
        }

        function useSuggestion(text) {
            if (isProcessing) return;
            userInput.value = text;
            sendMessage();
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>

</html>
