openapi: 3.0.3
info:
  title: OSLO API
  description: "This is a REST interface for accessing and managing ibi\u2122 WebFOCUS\u00AE assets."
  contact:
    name: API Support
    email: yto@tibco.com
  version: 10.0.0
servers:
- url: /oslo/1.0
  description: "ibi\u2122 WebFOCUS\u00AE Reporting Server"
tags:
- name: Domains
  description: Inspects and manages user items found within their domain hierarchies.
- name: Resources
  description: Get the contents of a resource.
- name: Schemas
  description: Metadata-related operations
- name: System
  description: Policy-related operations
- name: DSP
  description: DSP environment-related operations
- name: Geo
  description: GIS-related operations
- name: Core
  description: Core operations
- name: Configuration
  description: Configuration-related operations
- name: Ping server
  description: Check the reachability of a host
- name: WebFOCUS GIT commands
  description: "ibi\u2122 WebFOCUS\u00AE GIT commands methods"
- name: WebFOCUS cached reports
  description: "ibi\u2122 WebFOCUS\u00AE cached reports methods"
- name: Health Check
  description: Check the health of the server
- name: Solr
  description: Solr operations
paths:
  /domains:
    get:
      tags:
      - Domains
      summary: Gets a list of items found within the domain hierarchy.
      description: |
        Retrives the contents of the domains.
      operationId: getDomains
      parameters:
      - name: depth
        in: query
        description: |
          Depth.
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        "200":
          description: results matching criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domainSuccessJS'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/domainSuccessJS'
        default:
          $ref: '#/components/schemas/failure'
    post:
      tags:
      - Domains
      summary: Retrieves a list of objects from the domain starting from an array of IDs.
      description: |
        Retrives the contents of the domains.
      operationId: postDomains
      parameters:
      - name: depth
        in: query
        description: |
          Depth.
        required: false
        schema:
          type: integer
          minimum: 0
      requestBody:
        content:
          'application/json:':
            schema:
              $ref: '#/components/schemas/domainsPostBody'
            examples:
              Example 1:
                $ref: '#/components/examples/domainsPostBody'
        required: true
      responses:
        "200":
          description: results matching criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domainSuccessJS'
        default:
          $ref: '#/components/schemas/failure'
  /domains/{itemId}:
    get:
      tags:
      - Domains
      summary: Retrieves a list of objects from the domain starting from the specified ID.
      description: |
        Retrives the contents of the domains for an ID.
      operationId: getDomainItemById
      parameters:
      - name: itemId
        in: path
        description: |
          Unique ID of the artifact.
          The ID may alternatively be a base64 encoded path of the artifact being requested.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          ibisamp:
            value: aWJpc2FtcA
          retail_samples/dimensions:
            value: cmV0YWlsX3NhbXBsZXMvZGltZW5zaW9ucw
          ibisamp/car.mas:
            value: aWJpc2FtcC9jYXIubWFz
          ibisamp/employee.mas:
            value: aWJpc2FtcC9lbXBsb3llZS5tYXM
          retail_samples/wf_retail_lite.mas:
            value: cmV0YWlsX3NhbXBsZXMvd2ZfcmV0YWlsX2xpdGUubWFz
      - name: namecontain
        in: query
        description: |
          Return only results containing "namecontain" in the resource name.
        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          empty:
            value:
          car:
            value: car
          brokers:
            value: brokers
      - name: extension
        in: query
        description: |
          Return only results which extension equal "extension".
        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          empty:
            value:
          mas:
            value: mas
          foc:
            value: foc
      - name: depth
        in: query
        description: |
          Depth.
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        "200":
          description: search results matching criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domainSuccessJS'
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/domainSuccessJS'
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
        default:
          description: An error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
  /domains/{itemId}/properties:
    get:
      tags:
      - Domains
      summary: Retrieves a hierarchical list of objects within the domain starting from the selected object
      operationId: getDomainItemPropertiesById
      parameters:
      - name: itemId
        in: path
        description: |
          Unique ID of the artifact.
          The ID may alternatively be a base64 encoded path of the artifact being requested.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          ibisamp:
            value: aWJpc2FtcA
          retail_samples/dimensions:
            value: cmV0YWlsX3NhbXBsZXMvZGltZW5zaW9ucw
          ibisamp/car.mas:
            value: aWJpc2FtcC9jYXIubWFz
          ibisamp/employee.mas:
            value: aWJpc2FtcC9lbXBsb3llZS5tYXM
          retail_samples/wf_retail_lite.mas:
            value: cmV0YWlsX3NhbXBsZXMvd2ZfcmV0YWlsX2xpdGUubWFz
      responses:
        "200":
          description: search results matching criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domainItemPropertiessJS'
        "400":
          description: Bad input parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
  /domains/{itemId}/actions:
    get:
      tags:
      - Domains
      summary: Retrieves the enitre list of actions for the specified ID.
      description: |
        Retrieves the entire list of actions for a domain object.
        The translated text for display and with callback to execute action is included in the result set.
      operationId: getDomainActionsById
      parameters:
      - name: itemId
        in: path
        description: |
          Unique ID of the artifact.
          The ID may alternatively be a base64 encoded path of the artifact being requested.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          ibisamp/car.mas:
            value: aWJpc2FtcC9jYXIubWFz
          ibisamp/employee.mas:
            value: aWJpc2FtcC9lbXBsb3llZS5tYXM
          retail_samples/wf_retail_lite.mas:
            value: cmV0YWlsX3NhbXBsZXMvd2ZfcmV0YWlsX2xpdGUubWFz
      responses:
        "200":
          description: action list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200'
        "400":
          description: Bad input parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
  /domains/{synId}/schema:
    post:
      tags:
      - Domains
      summary: |
        Generate schema for resource id with combined query.
      description: Get the resultant schema resource defintion with combined supplied query.
      operationId: postSchemaResourceContentByIdWithQuery
      parameters:
      - name: synId
        in: path
        description: |
          Unique ID of the artifact.
          The ID may alternatively be a base64 encoded path of the artifact being requested.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          ibisamp/car:
            value: aWJpc2FtcC9jYXI
          ibisamp/employee:
            value: aWJpc2FtcC9lbXBsb3llZQ
          retail_samples/wf_retail_lite:
            value: cmV0YWlsX3NhbXBsZXMvd2ZfcmV0YWlsX2xpdGU
      - name: output
        in: query
        description: |
          Posible value is "short"
        required: false
        style: form
        explode: true
        schema:
          type: string
      requestBody:
        content:
          'application/json:':
            schema:
              $ref: '#/components/schemas/body_6'
            examples:
              Example 1:
                value: |
                  {
                    "fex": "END"
                  }
              Example 2:
                value: |
                  {
                    "fex": "DEFINE FILE ibisamp/car\nPROFIT/D7 ( TITLE = 'Profit' ) =CAR.BODY.RETAIL_COST-CAR.BODY.DEALER_COST;\nEND"
                  }
              Example 3:
                value: |
                  {
                    "fex": "JOIN INNER\nEMP_ID\nIN ibisamp/employee TAG T01\nTO\nEMP_ID\nIN ibisamp/educfile TAG T02\nAS 'Join 1'\nEND"
                  }
        required: true
      responses:
        "200":
          description: The resultant schema resource defintion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemaDataDefinitionJS'
              examples:
                ibisamp/employee:
                  $ref: '#/components/examples/schemaGetSuccess_ibisamp_employee'
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                        code:
                          type: integer
                        detail:
                          type: string
                example: |
                  {
                    "errors": [
                      {
                        "id": "205",
                        "status": "Not Found",
                        "code": 404,
                        "detail": "(FOC205) THE DESCRIPTION CANNOT BE FOUND FOR FILE NAMED: ibisamp/car123"
                      }
                    ]
                  }
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                        code:
                          type: integer
                        detail:
                          type: string
                example: |
                  {
                    "errors": [
                      {
                        "id": "3601",
                        "status": "Internal Server Error",
                        "code": 500,
                        "detail": "(FOC03601) ERROR AT OR NEAR LINE 8 IN IBISAMP/CAR_ERR"
                      },
                      {
                        "id": "1822",
                        "status": "Internal Server Error",
                        "code": 500,
                        "detail": "(FOC1822) Invalid symbol in MFD parser: >=<"
                      }
                    ]
                  }
  /domains/{synId}/{rootId}/auto-analytics:
    post:
      tags:
      - Domains
      summary: Auto analytics request.
      description: |
        Auto analytics request.
      parameters:
      - name: synId
        in: path
        description: |
          Unique ID of the artifact.
          The ID may alternatively be a base64 encoded path of the artifact being requested.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          ibisamp/car:
            value: aWJpc2FtcC9jYXI
          ibisamp/employee:
            value: aWJpc2FtcC9lbXBsb3llZQ
          retail_samples/wf_retail_lite:
            value: cmV0YWlsX3NhbXBsZXMvd2ZfcmV0YWlsX2xpdGU
      - name: rootId
        in: path
        description: |
          UID of the root segment in case of multi roots syn.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          ORIGIN:
            value: T1JJR0lO
          EMPINFO:
            value: RU1QSU5GTw
          WF_RETAIL_SALES:
            value: V0ZfUkVUQUlMX1NBTEVT
      - name: exclude_ts
        in: query
        description: Hide Timeseries 
        schema:
          type: boolean
          default: false
        required: false
      - name: deferred
        in: query
        description: Deferred execution
        schema:
          type: boolean
          default: false
        required: false
      - name: json_insights
        in: query
        description: Json Insights Focexecs
        schema:
          type: boolean
          default: false
        required: false
      requestBody:
        content:
          text/plain:
            schema:
              type: string
            example: |
              {
                "fex": "JOIN INNER EMP_ID IN ibisamp/employee TAG T01 TO EMP_ID IN ibisamp/educfile TAG T02 AS 'Join 1'\nEND"
              }
      responses:
        "200":
          description: Result of auto analytics request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200'
        "400":
          description: Bad input parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
  /domains/{synId}/auto-analytics:
    post:
      tags:
