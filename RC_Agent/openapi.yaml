  /domains/{synId}/nlq:
    post:
      tags:
      - Domains
      summary: Translate Natural Language Query to Focus language.
      parameters:
      - name: synId
        in: path
        description: |
          Unique ID of the artifact.
          The ID may alternatively be a base64 encoded path of the artifact being requested.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        examples:
          ibisamp/car:
            value: aWJpc2FtcC9jYXI
          ibisamp/employee:
            value: aWJpc2FtcC9lbXBsb3llZQ
          retail_samples/wf_retail_lite:
            value: cmV0YWlsX3NhbXBsZXMvd2ZfcmV0YWlsX2xpdGU
      requestBody:
        content:
          'application/json:':
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
            examples:
              Show me car by country:
                value: |
                  {"query": "Show me car by country", "timeout": 60}
              Show me top 3 sales by country:
                value: |
                  {"query": "Show me top 3 sales by country", "timeout": 30}
              What are the total MPG by CAR and BODYTYPE:
                value: |
                  {"query": "What are the total MPG by CAR and BODYTYPE", "timeout": 30}
              What is the total SALES by BODYTYPE:
                value: |
                  {"query": "What is the total SALES by BODYTYPE?", "timeout": 30}
              What is the average LENGTH and HEIGHT by CAR:
                value: |
                  {"query": "What is the average LENGTH and HEIGHT by CAR?", "timeout": 30}
              what are the total SALES by BODYTYPE:
                value: |
                  {"query": "what are the total SALES by BODYTYPE", "timeout": 30}
              what are the average DEALER_COST by CAR:
                value: |
                  {"query": "what are the average DEALER_COST by CAR", "timeout": 30}
              what are the total SALES and average DEALER COST by BODYTYPE:
                value: |
                  {"query": "what are the total SALES and average DEALER COST by BODYTYPE", "timeout": 30}
              what are the max WHEELBASE by CAR and BODYTYPE:
                value: |
                  {"query": "what are the max WHEELBASE by CAR and BODYTYPEE", "timeout": 30}
              SALES:
                value: |
                  {"query": "SALES", "timeout": 30}
              SALES and CAR:
                value: |
                  {"query": "SALES and CAR", "timeout": 30}
              List all cars with their sales:
                value: |
                  {"query": "List all cars with their sales", "timeout": 30}
              What are the total SALES by COUNTRY and CAR:
                value: |
                  {"query": "What are the total SALES by COUNTRY and CAR", "timeout": 30}
              SALES and WHEELBASE:
                value: |
                  {"query": "SALES and WHEELBASE", "timeout": 30}
              what are the average LENGTH WIDTH and HEIGHT by BODYTYPE:
                value: |
                  {"query": "what are the average LENGTH WIDTH and HEIGHT by BODYTYPE", "timeout": 30}
              what are average LENGTH and HEIGHT by CAR:
                value: |
                  {"query": "what are average LENGTH and HEIGHT by CAR", "timeout": 30}
              How are MPG and RPM varying with the car LENGTH:
                value: |
                  {"query": "How are MPG and RPM varying with the car LENGTH", "timeout": 30}
              Which 5 zip codes has the highest average balance? Sort the zip codes by the average balance in descending order.:
                value: |
                  {"query": "Which 5 zip codes has the highest average balance? Sort the zip codes by the average balance in descending order.", "timeout": 30}
        required: true
      responses:
        "200":
          description: Focus language as well as visualization.
          content:
            application/json:
              schema:
                type: object
                required:
                  - focus
                  - visualization
                properties:
                  focus:
                    type: string
                  sql:
                    type: string
                  query:
                    type: string
                  visualization:
                    type: string
              examples:
                cars from Italy:
                  value: |
                    {
                      "focus": "TABLE FILE CAR PRINT COMP.CAR WHERE ( UPPER(ORIGIN.COUNTRY) EQ UPPER('italy') ) ; END",
                      "sql":"SELECT T1.CAR FROM car T1 WHERE UPPER(T1.COUNTRY) = UPPER('italy')",
                      "visualization": "table"
                    }
                Show me top 3 sales by country:
                  value: >
                    {
                      "focus": "TABLE FILE ibisamp/car
                                BY HIGHEST TOTAL SUM.BODY.SALES AS 'total sum of SALES'
                                BY ORIGIN.COUNTRY 
                                IF OUTPUTLIMIT IS 3 
                                END",
                      "sql": "SELECT 
                                SUM(T1."SALES" ) AS "total sum of SALES" ,
                                T1."COUNTRY" 
                              FROM 
                                IBISAMP.CAR T1
                              GROUP BY
                                T1."COUNTRY"  
                              ORDER BY
                                SUM(T1."SALES" ) DESC
                              FETCH FIRST 3 ROWS ONLY",
                      "visualization": "table"
                    }
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
        "404":
          description: Business reject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
        default:
          $ref: '#/components/schemas/failure'
