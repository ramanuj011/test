        content:
          'application/json:':
            schema:
              $ref: '#/components/schemas/coreEngineFilter'
            examples:
              with no arguments:
                value: |
                  {
                    "object": "functions",
                    "match" : "any",
                    "filters" : [
                      {
                      "relation": "equal",
                      "key" : "arg_number",
                      "value" : ["0"],
                      "case-sensitive" : "true"
                      }
                    ]
                  }
              with one or two arguments:
                value:
                  {
                    "object": "functions",
                    "match" : "any",
                    "filters" : [
                      {
                      "relation": "equal",
                      "key" : "arg_number",
                      "value" : [
                        "1",
                        "2"],
                      "case-sensitive" : "true"
                      }
                    ]
                  }
        required: true
      responses:
        200:
          description: The function list
          content:
            application/json:
              schema:
