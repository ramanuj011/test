        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          ALL category:
            value:
          SETTING:
            value: S
          SYSVAR:
            value: V
          ADPTSET:
            value: A
          KEYWORD:
            value: K
          LIMIT:
            value: L
      - name: setname
        in: query
        description: Returns settings with specified setname.
        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          Not set:
            value:
          ACCESSHTML:
            value: ACCESSHTML
          WHERE_OPTIMIZE:
            value: WHERE_OPTIMIZE
          DFLTPAGE:
            value: DFLTPAGE
      responses:
        "200":
          description: A categorized list of WFRS settings.
          content:
            'application/json:':
              schema:
                $ref: '#/components/schemas/coreEngineSettingsSuccess'
              examples:
                Example 1:
                  $ref: '#/components/examples/coreEngineSettingsSuccess'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
    post:
      tags:
        - Core
      summary: Get categorized list of WFRS settings with advanced filtering.
      parameters:
      - name: category
        in: query
        description: Returns all settings in this category.
        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          ALL category:
            value:
          SETTING:
            value: S
          SYSVAR:
            value: V
          ADPTSET:
            value: A
          KEYWORD:
            value: K
          LIMIT:
            value: L
      - name: setname
        in: query
        description: Returns settings with specified setname.
        required: false
        style: form
        explode: true
        schema:
          type: string
        examples:
          Not set:
            value:
          ACCESSHTML:
            value: ACCESSHTML
          WHERE_OPTIMIZE:
            value: WHERE_OPTIMIZE
          DFLTPAGE:
            value: DFLTPAGE
      requestBody:
        description: |
          Returns settings using advanced filtering.
        content:
          'application/json:':
            schema:
              $ref: '#/components/schemas/coreEngineFilter'
            examples:
              WHERE_OPTIMIZE:
                value: |
                  {
                    "object": "records",
                    "match": "any",
                    "filters": [
                      {
                        "relation": "equal",
                        "key": "SETNAME",
                        "value": [
                          "WHERE_OPTIMIZE"
                        ],
                        "case-sensitive": "false"
                      },
                      {
                        "relation": "equal",
                        "key": "SETALIAS",
                        "value": [
                          "WHOPTM"
                        ],
                        "case-sensitive": "false"
                      }
                    ]
                  }
        required: false
      responses:
        "200":
          description: A categorized list of WFRS settings.
          content:
            'application/json:':
              schema:
                $ref: '#/components/schemas/coreEngineSettingsSuccess'
              examples:
                Example 1:
                  $ref: '#/components/examples/coreEngineSettingsSuccess'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failure'
