version: '3.8'

services:
  mcp-server:
    build: ./mcp-server
    container_name: mcp-server
    ports:
      - "8080:3000"
    environment:
      - OSLO_BASE_URL=http://192.168.1.4:31090/webfocus
      - OSLO_USERNAME=secret
      - OSLO_PASSWORD=terces

  agent:
    build: ./agent
    container_name: agent
    environment:
      - MCP_SERVER_URL=http://mcp-server:3000/mcp
      - PORT=5000
      - OPENAI_API_KEY=
      - LLM_PROVIDER=openai
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - OLLAMA_MODEL=llama3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8082:5000"
    command: server
    depends_on:
      - mcp-server
    # To run the CLI directly: `docker compose run --rm agent list-schedules`
